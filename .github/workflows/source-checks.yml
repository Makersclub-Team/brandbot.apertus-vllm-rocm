name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Python source
        run: python3 -m compileall -q scripts tests
      - name: Check build-plan contract
        run: python3 -m unittest discover -s tests -v
      - name: Clarify scope
        run: echo 'Source checks only; container and GPU validation have not run.'
